<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Socket.IO Chat</title>
    <link rel="stylesheet" href="/css/styles.css" />
  </head>
  <body>
    <div class="chat-container">
      <header class="chat-header">
        <h1>Socket.IO Chat</h1>
        <p class="subtitle">A small realtime demo — be kind, say hello 👋</p>
      </header>

      <div class="username-bar">
        You are: <span id="usernameDisplay">Anonymous</span>
      </div>

      <div
        class="messages"
        id="messageArea"
        role="log"
        aria-live="polite"
      ></div>

      <div class="input-container">
        <input
          type="text"
          id="messageInput"
          placeholder="Type your message..."
          aria-label="Message input"
          autofocus
        />
        <button type="button" class="send-button" aria-label="Send message">
          Send
        </button>
      </div>
    </div>

    <!-- Load the Socket.IO client script from the server so the browser can connect to the WebSocket endpoint -->
    <script src="/socket.io/socket.io.js"></script>
    <script src="/js/chat.js"></script>
  </body>
</html>
